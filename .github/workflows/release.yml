name: Release

# Run only when a Git tag is pushed (example: v1.0.0)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新打包的 Git 标签，例如 v1.2.1'
        required: true
        type: string

# Required for publishing to GHCR and creating GitHub Releases
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Publish, and Release
    runs-on: ubuntu-latest

    steps:
      # Fetch repository content for Docker build context
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}


      # Enable arm64 emulation so we can build multi-arch on GitHub-hosted runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Create and configure a Buildx builder instance
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry using GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image name and tag from the pushed Git tag
      - name: Prepare image metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Build and push multi-architecture image with both latest and version tags
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: rewards-dashboard
          file: rewards-dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Package versioned source archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="rewards-dashboard-${TAG}"
          mkdir -p "dist/${ROOT}"
          git archive "${TAG}" | tar -x -C "dist/${ROOT}"
          printf 'window.APP_VERSION = "%s";\n' "${TAG}" > "dist/${ROOT}/rewards-dashboard/public/version.js"
          (cd dist && zip -qr "../${ROOT}.zip" "${ROOT}")

      - name: Generate release notes from commits
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## 变更内容"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "${PREVIOUS_TAG} 到 ${TAG} 的提交："
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "${PREVIOUS_TAG}..${TAG}"
            else
              echo "${TAG} 的提交："
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "${TAG}"
            fi
            echo
          } > release-notes.md

      # Create or update a GitHub Release using the generated commit list
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Rewards Dashboard $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "Rewards Dashboard $TAG" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" "rewards-dashboard-${TAG}.zip" --clobber
